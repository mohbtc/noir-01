<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOIR//01 — ZERO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ================================
       NOIR//01 — THE ENTRY
  ================================= -->
  <main class="entry" id="entry">
<!-- TOP NAV -->
<header class="entry-nav">
  <div class="brand">
    NOIR<span>//</span>01
  </div>
  <div class="system">
    SYSTEM / 001
  </div>
</header>
<!-- HERO PRODUCT -->
<section class="hero">
  <div class="hero-glow"></div>
  <div class="product-wrap" id="productWrap">
    <img
      class="zero-product"
      id="zeroProduct"
      src="./images/0E44EA43-F379-42D3-ADFC-34E81B2BAE3B.jpeg"
      alt="NOIR//01 ZERO sneaker"
    >
  </div>
</section>
<!-- PRODUCT INFORMATION -->
<div class="hero-info">
  <div class="product-name">
    ZERO
  </div>
  <div class="product-description">
    THE FIRST ITERATION.
  </div>
</div>
<!-- BOTTOM UI -->
<div class="hero-bottom">
  <div class="scroll-label">
    <span class="scroll-line"></span>
    SCROLL TO ENTER
  </div>
  <div class="sound-control" id="soundControl">
    <span class="sound-dot"></span>
    SOUND OFF
  </div>
  <div class="movement">
    MOVE DIFFERENT.
  </div>
</div>
  </main>
  <!-- =================================
       SECTION 02 — THE OBJECT
  ================================= -->
  <section class="object-section" id="object">
<div class="object-grid">
  <div class="object-index">
    02 / THE OBJECT
  </div>
  <div class="object-heading">
    <span>NOT MADE</span>
    <span>TO BLEND IN.</span>
  </div>
  <div class="object-copy">
    ZERO is the first expression of NOIR//01.
    Built around restraint, contrast and movement.
  </div>
</div>
<div class="object-visual">
  <div class="object-glow"></div>
  <img
    src="./images/0E44EA43-F379-42D3-ADFC-34E81B2BAE3B.jpeg"
    alt="NOIR//01 ZERO"
    class="object-product"
  >
</div>
<div class="object-footer">
  <span>FORM / 001</span>
  <span>ZERO</span>
  <span>NO COMPROMISE</span>
</div>
  </section>
  <script src="script.js"></script>
</body>
</html>
